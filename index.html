<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HealthGuard</title>
    <style>/* ================= GLOBAL ================= */
* {
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #ffffff;
}

/* ================= TOP BAR ================= */
.top-bar {
    padding: 20px 40px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.logo span {
    display: block;
    font-size: 13px;
    font-weight: normal;
    opacity: 0.85;
}

/* ================= MAIN LAYOUT ================= */
.main-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
}

/* ================= CARD ================= */
.card {
    width: 460px;
    max-width: 100%;
    padding: 30px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
}

/* ================= HEADINGS ================= */
.card h1 {
    text-align: center;
    margin-bottom: 6px;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    opacity: 0.85;
    margin-bottom: 25px;
}

/* ================= SPACING BLOCKS ================= */
.block {
    margin-bottom: 18px;
}

/* ================= INPUTS ================= */
input,
select {
    width: 100%;
    min-width: 0;
    height: 44px;
    padding: 10px 12px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: rgba(255, 255, 255, 0.95);
    font-size: 14px;
    color: #111827;
}

/* ================= GRID ================= */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.full {
    grid-column: 1 / -1;
}

/* ================= HIDDEN ================= */
.hidden {
    display: none;
}

/* ================= BUTTON ================= */
button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0, 114, 255, 0.5);
}

/* ================= NOTE ================= */
.note {
    margin-top: 18px;
    text-align: center;
    font-size: 12px;
    opacity: 0.85;
}

/* ================= RESULT BOX ================= */
.result {
    margin-top: 15px;
    padding: 14px;
    border-radius: 12px;
    text-align: center;
    font-weight: bold;
    font-size: 16px;
}

/* Risk Colors */
.low {
    background: #dcfce7;
    color: #166534;
}

.moderate {
    background: #fef3c7;
    color: #92400e;
}

.high {
    background: #fee2e2;
    color: #991b1b;
}

/* ================= ADVICE LIST ================= */
ul {
    padding-left: 20px;
    margin-top: 12px;
}

ul li {
    margin-bottom: 8px;
    font-size: 14px;
}

/* ================= LINKS ================= */
a {
    display: block;
    margin-top: 20px;
    text-align: center;
    text-decoration: none;
    color: #38bdf8;
    font-weight: 600;
}

a:hover {
    text-decoration: underline;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 520px) {
    .card {
        width: 100%;
    }

    .grid {
        grid-template-columns: 1fr;
    }
}</style>
</head>
<body>

<header class="top-bar">
    <div class="logo">
        🩺 <strong>HealthGuard</strong>
        <span>Diabetes & Heart Risk Prediction</span>
    </div>
</header>

<div class="main-wrapper">
    <div class="card">
        <h1>Check Your Health Risk</h1>
        <p class="subtitle">Enter only the required health values below.</p>

        <form action="/predict" method="POST">

            <!-- MODE (BLOCK LEVEL) -->
            <div class="block">
                <select name="mode" onchange="toggleFields(this.value)" required>
                    <option value="">Select Prediction Mode</option>
                    <option value="diabetes">Diabetes Prediction</option>
                    <option value="heart">Heart Disease Prediction</option>
                </select>
            </div>

            <!-- COMMON FIELDS -->
            <div class="block grid">
                <input type="number" name="age" placeholder="Age" required>

                <select name="gender" required>
                    <option value="">Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>

                <input type="number" step="0.1" name="weight" placeholder="Weight (kg)" required>
                <input type="number" step="0.1" name="height" placeholder="Height (cm)" required>

                <select name="activity" class="full" required>
                    <option value="">Physical Activity</option>
                    <option value="active">Active</option>
                    <option value="moderate">Moderate</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>

            <!-- DIABETES FIELDS -->
            <div id="diabetes-fields" class="block grid hidden">
                <input type="number" name="sugar" placeholder="Blood Sugar (mg/dL)">
                <select name="family_diabetes">
                    <option value="">Family History of Diabetes</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <!-- HEART FIELDS -->
            <div id="heart-fields" class="block grid hidden">
                <input type="number" name="bp" placeholder="Blood Pressure (Systolic)">
                <input type="number" name="cholesterol" placeholder="Cholesterol (mg/dL)">

                <select name="smoking">
                    <option value="">Smoking Habit</option>
                    <option value="yes">Smoker</option>
                    <option value="no">Non-Smoker</option>
                </select>

                <select name="family_heart">
                    <option value="">Family History of Heart Disease</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </div>

            <button type="submit">Predict Risk</button>
        </form>

        <p class="note">
            ⚠️ This is only a prediction model. Consult a doctor for diagnosis.
        </p>
    </div>
</div>

<script>
function toggleFields(mode) {
    document.getElementById("diabetes-fields").classList.toggle("hidden", mode !== "diabetes");
    document.getElementById("heart-fields").classList.toggle("hidden", mode !== "heart");
}
</script>

</body>
</html>
